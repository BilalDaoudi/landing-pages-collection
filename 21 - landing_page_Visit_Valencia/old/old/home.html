<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Page d'accueil</title>
        <style>
       
       body{
            margin: 0;
        }
        .home-section {
            position: relative;
            text-align: center;
            color: white;
        }
        .home-image {
            width: 100%;
            height: auto;
        }
        .centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 10px;
            font-family:Montserrat, sans-serif;
        }
        .centered .centered-title{
            font-size: 55px;
            margin: 0;
        }
        .centered .centered-sous-title{
    font-weight: 700;
    font-style: normal;
    font-size: 2rem;
    line-height: 1.2;
    margin: 0 0 1.5rem;
    width: auto;
        }
        
    </style>
    </head>
    <body>
        <section class="home-section" id="home">
            <img src="4.webp" alt="Image de la page d'accueil"
                class="home-image">
            <div class="centered"><p class="centered-title">Visit Valencia</p>
                <p class="centered-sous-title">La destination durable en
                    Méditerranée</p></div>
        </section>
    </body>
</html>
